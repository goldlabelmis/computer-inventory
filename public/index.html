<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>168 Computer Inventory</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="navbar">
    <div class="container-fluid nav-content">
      <div class="brand">
        <span class="brand-icon">🖥️</span>
        <h2>168 Computer Inventory</h2>
      </div>
      <div class="actions">
        <input type="text" id="search-input" placeholder="Search..." class="search-bar">
        <button class="btn btn-outline admin-only" onclick="exportToExcel()">📊 Export Excel</button>
        <button class="btn btn-outline admin-only" onclick="openTechModal()">🛠️ Technicians</button>
        <button class="btn btn-primary admin-only" onclick="openModal('workstation-modal')">+ Add Workstation</button>
        <button id="auth-btn" class="btn btn-warning" onclick="openModal('login-modal')">🔒 Login</button>
      </div>
    </div>
  </header>

  <div class="app-layout">
    <!-- SIDEBAR FOR PC NAMES -->
    <aside class="sidebar">
      <h3>Computers</h3>
      <ul id="pc-list-sidebar">
        <li class="active" onclick="filterByPC('ALL')">💻 All PCs</li>
      </ul>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <!-- USER STATUS BAR -->
      <div class="status-bar">
        <div id="user-info"><span>View Only Mode</span></div>
      </div>

      <!-- ANALYTICS DASHBOARD WIDGET WITH DISTINCT ACCENT BORDERS -->
      <div id="analytics-dashboard">
        <div class="stat-card card-blue">
          <div class="stat-title">💻 Total PCs</div>
          <div class="stat-value" id="stat-pcs">0</div>
        </div>

        <div class="stat-card card-green">
          <div class="stat-title">🧩 Total Parts</div>
          <div class="stat-value" id="stat-parts">0</div>
        </div>

        <div class="stat-card card-amber">
          <div class="stat-title">🛠️ Total Repairs</div>
          <div class="stat-value" id="stat-repairs">0</div>
        </div>

        <div class="stat-card card-purple">
          <div class="stat-title">👤 Technicians</div>
          <div class="stat-value" id="stat-techs">0</div>
        </div>
      </div>

      <div id="inventory-list"></div>
    </main>
  </div>

  <!-- MODAL: LOGIN -->
  <div id="login-modal" class="modal">
    <div class="modal-card modal-sm">
      <h3>🔒 User Login</h3>
      <form id="login-form">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="login-username" placeholder="GoldlabelMis" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="closeModal('login-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Sign In</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: ADD / EDIT WORKSTATION -->
  <div id="workstation-modal" class="modal">
    <div class="modal-card">
      <h3 id="workstation-modal-title">Add Workstation</h3>
      <form id="add-workstation-form">
        <input type="hidden" id="edit-comp-id">
        <div class="form-group"><label>Property Name</label><input type="text" id="prop-name" placeholder="r3com11" required></div>
        <div class="form-group"><label>Property Code</label><input type="text" id="prop-code" placeholder="168-r3com11" required></div>
        <div class="form-row">
          <div class="form-group"><label>Location</label><input type="text" id="prop-loc" placeholder="room3"></div>
          <div class="form-group"><label>Department</label><input type="text" id="prop-dept" placeholder="mis"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>DRP 1</label><input type="text" id="prop-drp1" placeholder="reinner"></div>
          <div class="form-group"><label>DRP 2</label><input type="text" id="prop-drp2" placeholder="joram"></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="closeModal('workstation-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: ADD / EDIT PART -->
  <div id="part-modal" class="modal">
    <div class="modal-card">
      <h3 id="part-modal-title">Add Part</h3>
      <form id="add-part-form">
        <input type="hidden" id="part-id">
        <input type="hidden" id="part-comp-id">
        <div class="form-row">
          <div class="form-group"><label>Type</label><input type="text" id="part-type" placeholder="CPU, Monitor..." required></div>
          <div class="form-group"><label>Brand</label><input type="text" id="part-brand" placeholder="KINGSTON"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Model</label><input type="text" id="part-model" placeholder="A400"></div>
          <div class="form-group"><label>Date Purchased</label><input type="text" id="part-date" placeholder="09/12/2024"></div>
        </div>
        <div class="form-group"><label>Serial Number</label><input type="text" id="part-sn"></div>
        <div class="form-group"><label>Specs</label><input type="text" id="part-specs"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="closeModal('part-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: ADD / EDIT REPAIR -->
  <div id="repair-modal" class="modal">
    <div class="modal-card">
      <h3 id="repair-modal-title">Log Repair</h3>
      <form id="add-repair-form">
        <input type="hidden" id="repair-id">
        <input type="hidden" id="repair-comp-id">
        <div class="form-row">
          <div class="form-group"><label>Date</label><input type="text" id="repair-date" placeholder="12/16/2025" required></div>
          <div class="form-group"><label>Item</label><input type="text" id="repair-item" placeholder="Keyboard" required></div>
        </div>
        <div class="form-group"><label>Description</label><input type="text" id="repair-desc" placeholder="Replaced" required></div>
        
        <div class="form-group">
          <label>Technician</label>
          <select id="repair-remarks" class="form-select" required>
            <option value="" disabled selected>-- Select Technician --</option>
          </select>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="closeModal('repair-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: MANAGE TECHNICIANS -->
  <div id="tech-modal" class="modal">
    <div class="modal-card">
      <h3>Manage Technicians</h3>
      <form id="add-tech-form" class="admin-only" style="margin-bottom: 1rem;">
        <div class="form-row">
          <div class="form-group" style="margin: 0;">
            <input type="text" id="new-tech-name" placeholder="Enter technician name..." required>
          </div>
          <button type="submit" class="btn btn-primary">+ Add</button>
        </div>
      </form>

      <div class="tech-list-wrapper">
        <ul id="tech-manage-list" style="list-style: none; margin: 0; padding: 0;"></ul>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-outline" onclick="closeModal('tech-modal')">Close</button>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
